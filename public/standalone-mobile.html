// Web Audio Acoustic Search Beacon Synthesizer
let audioCtx = null;
let beaconInterval = null;

function toggleAcousticSearchBeacon() {
    STATE.acousticBeaconActive = !STATE.acousticBeaconActive;
    const btn = document.getElementById("acoustic-beacon-btn");
    
    if (STATE.acousticBeaconActive) {
        if (btn) btn.className = "flex-1 py-2.5 bg-red-600 text-white font-bold rounded-xl text-xs flex items-center justify-center space-x-1.5 shadow animate-pulse";
        showToast("🔊 Acoustic Search Beacon ACTIVATED: Emitting 880Hz Sonar Pulses for Rescue Canines & Boats", "critical");
        
        beaconInterval = setInterval(() => {
            playSirenPulse();
        }, 1200);
    } else {
        if (btn) btn.className = "flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold rounded-xl text-xs border border-slate-300 flex items-center justify-center space-x-1.5";
        if (beaconInterval) clearInterval(beaconInterval);
        showToast("Acoustic Search Beacon Deactivated.", "info");
    }
}

function playSirenPulse() {
    try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        if (!audioCtx) audioCtx = new AudioContext();
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.4);
        
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
    } catch(e) {}
}

}

// Live Worldwide Weather Fetching
async function fetchLiveOpenMeteo(lat, lng, locName) {
    try {
        if (locName) STATE.currentLocationName = locName;
        STATE.userCoords = [lat, lng];

        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,relative_humidity_2m,precipitation,rain,surface_pressure,wind_speed_10m&timezone=auto`;
        const res = await fetch(url);
        if (res.ok) {
            const data = await res.json();
            const cur = data.current;
            if (cur) {
                STATE.telemetry.temperature = Math.round(cur.temperature_2m * 10) / 10;
                STATE.telemetry.humidity = Math.round(cur.relative_humidity_2m);
                STATE.telemetry.pressure = Math.round(cur.surface_pressure * 10) / 10;
                STATE.telemetry.windSpeed = Math.round(cur.wind_speed_10m * 10) / 10;
                const rain = cur.precipitation || cur.rain || 0;
                STATE.telemetry.rainfall = rain > 0 ? rain : 48.0;
                STATE.telemetry.lastUpdated = new Date().toLocaleTimeString("en-IN") + " IST";
            }
        }
    } catch(err) {
        console.warn("Using baseline telemetry:", err);
    }
}

// Live Search & Geocoding
async function handleLocationSearch(query) {
    if (!query || query.trim().length < 2) return;
    try {
        showToast(`🔍 Searching live coordinates for "${query}"...`, "info");
        const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=en&format=json`;
        const res = await fetch(url);
        if (res.ok) {
            const data = await res.json();
            if (data.results && data.results.length > 0) {
                const item = data.results[0];
                const fullName = `${item.name}, ${item.admin1 || ""}, ${item.country || "India"}`;
                await fetchLiveOpenMeteo(item.latitude, item.longitude, fullName);
                showToast(`📍 Live Location Set: ${fullName}`, "success");
                navigate("home");
            } else {
                showToast("Location not found. Try searching city or district name.", "critical");
            }
        }
    } catch(e) {
        showToast("Search failed. Check connectivity.", "critical");
    }
}

// Device GPS Auto-Detect
function detectDeviceGPS() {
    if ("geolocation" in navigator) {
        showToast("📡 Accessing Device GPS Location...", "info");
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            await fetchLiveOpenMeteo(lat, lng, `My GPS Position (${lat.toFixed(3)}°, ${lng.toFixed(3)}°)`);
            showToast("📍 Live GPS Position Loaded!", "success");
            navigate("home");
        }, (err) => {
            showToast("GPS Permission denied or unavailable.", "critical");
        }, { timeout: 8000 });
    } else {
        showToast("Geolocation is not supported by your browser.", "critical");
    }
}

function navigate(tabId) {
    STATE.currentTab = tabId;
    const viewport = document.getElementById("screen-viewport");
    if (!viewport) return;

    viewport.scrollTop = 0;
    updateBottomNav();

    switch(tabId) {
        case "home": viewport.innerHTML = renderHomeScreen(); break;
        case "map": viewport.innerHTML = renderLiveMapScreen(); initMobileMap(); break;
        case "evacuate": viewport.innerHTML = renderEvacuateScreen(); initEvacuateRouteMap(); break;
        case "alerts": viewport.innerHTML = renderAlertsScreen(); break;
        case "profile": viewport.innerHTML = renderProfileScreen(); break;
        case "sos": viewport.innerHTML = renderSOSScreen(); break;
        case "shelters": viewport.innerHTML = renderSheltersScreen(); break;
        case "mesh-simulator": viewport.innerHTML = renderMeshSimulatorScreen(); break;
        case "cwc-telemetry": viewport.innerHTML = renderCwcTelemetryScreen(); break;
        case "broadcast-preview": viewport.innerHTML = renderBroadcastPreviewScreen(); break;
        case "recovery": viewport.innerHTML = renderRecoveryScreen(); break;
        case "family-safety": viewport.innerHTML = renderFamilySafetyScreen(); break;
        case "evac-kit": viewport.innerHTML = renderEvacKitScreen(); break;
        case "authority": viewport.innerHTML = renderAuthorityScreen(); break;
        default: viewport.innerHTML = renderHomeScreen(); break;
    }

    setTimeout(() => { if (window.lucide) lucide.createIcons(); }, 50);
}

}

function updateBottomNav() {
    const nav = document.getElementById("bottom-tab-bar");
    if (!nav) return;

    const tabs = [
        { id: "home", label: "Home", icon: "home" },
        { id: "map", label: "Live Map", icon: "map" },
        { id: "evacuate", label: "Evacuate", icon: "navigation" },
        { id: "alerts", label: "Alerts", icon: "bell", badge: STATE.alerts.length },
        { id: "profile", label: "Profile", icon: "user" }
    ];

    nav.innerHTML = tabs.map(t => `
        <button onclick="navigate('${t.id}')" class="flex flex-col items-center justify-center flex-1 py-1 transition ${STATE.currentTab === t.id ? "text-blue-900 font-black border-t-2 border-orange-500" : "text-slate-500 hover:text-slate-800"}">
            <div class="relative">
                <i data-lucide="${t.icon}" class="w-5 h-5"></i>
                ${t.badge ? `<span class="absolute -top-1 -right-1.5 w-3.5 h-3.5 bg-red-600 rounded-full text-[8px] font-bold text-white flex items-center justify-center">${t.badge}</span>` : ""}
            </div>
            <span class="text-[10px] mt-0.5 tracking-tight font-medium">${t.label}</span>
        </button>
    `).join("");

    if (window.lucide) lucide.createIcons();
}

                    </button>

                    </div>
                    <input type="range" min="0" max="6" step="1" value="${STATE.inundationHour}" class="w-full accent-blue-900" oninput="updateInundationSlider(this.value)">
                    <div class="flex justify-between text-[9px] text-slate-400 font-mono">
                        <span>Now (0h)</span>
                        <span>+1h (Runoff)</span>
                        <span>+3h (Crest)</span>
                        <span>+6h (Receding)</span>
                    </div>
                </div>
            </div>

            <div class="bg-white border border-slate-200 rounded-xl p-1 shadow-sm h-[440px]">
                <div id="mobile-risk-map" class="w-full h-full rounded-lg z-0"></div>
            </div>
        </div>
    `;
}

function updateInundationSlider(val) {
    STATE.inundationHour = parseInt(val);
    document.getElementById("slider-hour-label").innerText = `+${val} Hours Forward (${val == 0 ? "Present Depth: 2.45m" : (val <= 3 ? `Peak Inundation: ${2.45 + val*0.4}m` : "Receding: 2.1m")})`;
    showToast(`🌊 Recomputed hydrodynamic runoff model for T+${val} hours!`, "info");
    initMobileMap();
}

function initMobileMap() {
    setTimeout(() => {
        if (STATE.activeMap) STATE.activeMap.remove();
        const map = L.map("mobile-risk-map", { zoomControl: true }).setView(STATE.userCoords, 14);
        STATE.activeMap = map;

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);

        // Dynamic Flood Polygon expanding based on Inundation Time-Slider
        const multiplier = 1 + (STATE.inundationHour * 0.25);
        const radius = 450 * multiplier;
        const color = STATE.inundationHour >= 3 ? "#991b1b" : "#dc2626";

        L.circle(STATE.userCoords, { color: color, fillColor: color, fillOpacity: 0.38, radius: radius }).addTo(map).bindPopup(`<b>⚠️ Dynamic Inundation Zone (T+${STATE.inundationHour}h)</b><br>Surge Radius: ${Math.round(radius)}m`);

        L.circleMarker(STATE.userCoords, { radius: 9, fillColor: "#1e3a8a", color: "#ffffff", weight: 2, fillOpacity: 1 }).addTo(map).bindPopup(`<b>📍 ${STATE.currentLocationName}</b><br>Altitude: ${STATE.telemetry.elevation}m`);

        STATE.shelters.forEach(s => {
            L.circleMarker([s.lat, s.lng], { radius: 9, fillColor: "#15803d", color: "#ffffff", weight: 2, fillOpacity: 1 }).addTo(map).bindPopup(`<b>🏕️ ${s.name}</b><br>Available: ${s.available} Beds`);
        });

        STATE.sosQueue.forEach(s => {
            L.circleMarker([s.lat, s.lng], { radius: 8, fillColor: "#dc2626", color: "#ffffff", weight: 2, fillOpacity: 1 }).addTo(map).bindPopup(`<b>🚨 SOS: ${s.userName}</b><br>Status: ${s.status}`);
        });
    }, 100);
}

function handleLiveSOSBroadcast(e) {
    e.preventDefault();
    const name = document.getElementById("sos-user-name").value;
    const phone = document.getElementById("sos-user-phone").value;
    const category = document.getElementById("sos-category").value;
    const count = parseInt(document.getElementById("sos-people-count").value) || 1;
    const hasInf = document.getElementById("sos-has-inf").checked;
    const hasEld = document.getElementById("sos-has-eld").checked;
    const hasMed = document.getElementById("sos-has-med").checked;
    const details = document.getElementById("sos-details").value;

    let score = 40;
    if (hasMed) score += 35;
    if (hasInf) score += 15;
    if (hasEld) score += 10;
    score = Math.min(100, score);

    const newSOS = {
        id: `SOS-${Date.now().toString().slice(-4)}`,
        userName: name,
        phone: phone,
        emergencyType: category,
        peopleCount: count,
        location: STATE.currentLocationName,
        lat: STATE.userCoords[0],
        lng: STATE.userCoords[1],
        hasInfant: hasInf,
        hasElderly: hasEld,
        hasMedical: hasMed,
        message: details,
        triageScore: score,
        status: "SUBMITTED",
        assignedTeam: "Pending NDRF Assignment",
        time: "Just now"
    };

    STATE.sosQueue.unshift(newSOS);
    playSirenPulse();
    showToast(`🚨 DISTRESS BEACON TRANSMITTED! ID: ${newSOS.id} (Triage: ${score}/100)`, "critical");

    setTimeout(() => {
        showToast("📢 NDRF Command Center received incoming emergency broadcast!", "info");
        toggleAuthorityMode();
    }, 1500);
}

function resolveLiveSOS(id) {

function showToast(message, type = "info") {
    const container = document.getElementById("toast-container");
    if (!container) return;

    const colors = {
        success: "bg-emerald-800 text-white",
        critical: "bg-red-700 text-white",
        info: "bg-blue-900 text-white"
    };

    const toast = document.createElement("div");
    toast.className = `p-3 rounded-xl shadow-lg text-[11px] font-bold max-w-sm ${colors[type] || colors.info} flex items-center justify-between space-x-2 pointer-events-auto`;
    toast.innerHTML = `
        <div class="flex items-center space-x-2">
            <span>${message}</span>
        </div>
        <button onclick="this.parentElement.remove()" class="text-white/80 hover:text-white text-sm">&times;</button>
    `;

    container.appendChild(toast);
    setTimeout(() => { toast.remove(); }, 4000);
}
